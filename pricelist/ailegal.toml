# Каталог цен AILegal для продажи по вызовам (pay-per-call).
#
# Себестоимость каждой позиции взята из замеров реального исполнения
# (см. `agentpay measure`), а не придумана. Тарифы внешних ресурсов
# намеренно оставлены неподтверждёнными: пока у тарифа нет источника и даты,
# каталог печатает PRICE TO VERIFY и цена является гипотезой.
#
# ВАЖНО: `ailegal.clause.extract` — единственная позиция, которой нужен
# внешний LLM-провайдер. Она не исполняется офлайн, и агент не притворяется,
# что исполнил её: `requires_provider` заставляет контур сказать правду.

currency = "USD"
market_origin = "INT"
target_margin = 0.60
minor_unit = 0.01

[rates]
# PRICE TO VERIFY: подставить фактические тарифы GigaChat и хостинга
# с датой и ссылкой на источник.
usd_per_million_tokens = 0.0
usd_per_cpu_hour = 0.0
usd_per_megabyte_out = 0.0
usd_per_storage_write = 0.0
usd_per_external_call = 0.0
verified_on = ""
source = "PLACEHOLDER — заполнить перед любым публичным прайсом"

# Детерминированные ядра: сети нет, стоимость — только процессорное время.
[[items]]
name = "ailegal.clause.risk"
description = "Risk Aggregation 2.0 по готовому списку клауз (document_risk_v2)"
cpu_seconds = 0.0004
bytes_out = 600
scheme = "exact"
tags = ["legal", "deterministic", "offline"]

[[items]]
name = "ailegal.clause.categorize"
description = "ClauseDNA 3.0: категоризация клауз по таблице типов"
cpu_seconds = 0.0002
bytes_out = 400
scheme = "exact"
tags = ["legal", "deterministic", "offline"]

# Требует внешнего провайдера: исполняется только при живом ключе.
[[items]]
name = "ailegal.clause.extract"
description = "Извлечение клауз из договора через LLM (GigaChat)"
cpu_seconds = 0.9
bytes_out = 24000
external_calls = 1
scheme = "upto"
requires_provider = "gigachat"
tags = ["legal", "llm", "network"]
