[project]
name = "agentpay"
version = "0.1.0"
description = "Rail-agnostic ценообразование и авторизация вызовов AI-агентов"
requires-python = ">=3.11"
dependencies = []

license = { text = "Apache-2.0" }
keywords = ["ai-agents", "trust", "verification", "x402", "usdc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/mrpkk/agentpay"
Repository = "https://github.com/mrpkk/agentpay"
Issues = "https://github.com/mrpkk/agentpay/issues"
Sponsor = "https://github.com/sponsors/mrpkk"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
agentpay = "agentpay.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentpay*"]
